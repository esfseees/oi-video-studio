<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信奥讲解视频工坊</title>
<link rel="icon" href="/char/xiaotuling">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#1E7BF0,#6FB8FF);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#1C2B4A}
form{width:min(360px,88vw);background:#fff;border-radius:20px;padding:30px 28px;text-align:center;box-shadow:0 18px 40px rgba(10,50,130,.25)}
img{width:96px;height:96px;object-fit:contain}
h1{font-size:21px;margin:8px 0 4px}
p{margin:0 0 18px;color:#6B7A99;font-size:14px}
input{width:100%;box-sizing:border-box;border:1px solid #DCE4F5;border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;outline:none}
input:focus{border-color:#1E7BF0;box-shadow:0 0 0 3px rgba(30,123,240,.14)}
button{width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;background:#1E7BF0;color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
#msg{min-height:20px;margin:10px 0 0;color:#E5484D;font-size:14px}
</style>
</head>
<body>
<form id="f">
  <img src="/char/xiaotuling" alt="">
  <h1>信奥讲解视频工坊</h1>
  <p>请输入访问密码</p>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button>进入</button>
  <div id="msg"></div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) return location.reload();
  let j = {}; try { j = await r.json(); } catch (err) { /* empty */ }
  document.getElementById('msg').textContent = j.error || '登录失败';
};
</script>
</body>
</html>
